# HA topology: 3 control-plane nodes with stacked etcd + 3 workers
#
# !!! REPLACE the 10.10.0.x addresses with your real server IPs before deploying !!!
# ansible_host = address Ansible uses to SSH in (public or bastion-reachable IP)
# ip           = node's primary private IP (kubelet/etcd bind address)

[kube_control_plane]
k8s-cp-1 ansible_host=10.10.0.11 ip=10.10.0.11 etcd_member_name=etcd1
k8s-cp-2 ansible_host=10.10.0.12 ip=10.10.0.12 etcd_member_name=etcd2
k8s-cp-3 ansible_host=10.10.0.13 ip=10.10.0.13 etcd_member_name=etcd3

[etcd:children]
kube_control_plane

[kube_node]
k8s-worker-1 ansible_host=10.10.0.21 ip=10.10.0.21
k8s-worker-2 ansible_host=10.10.0.22 ip=10.10.0.22
k8s-worker-3 ansible_host=10.10.0.23 ip=10.10.0.23

[all:vars]
# SSH user on the target servers (ubuntu / rocky / your image's default user)
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/k8s-deploy
ansible_become=true
