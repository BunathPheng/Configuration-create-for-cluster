# Traefik on host ports 80/443 for GCP passthrough LB (same port end-to-end)

deployment:
  kind: DaemonSet

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

hostNetwork: true

podSecurityContext:
  runAsUser: 0
  runAsNonRoot: false

securityContext:
  privileged: true
  runAsUser: 0
  runAsNonRoot: false
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: true
  capabilities:
    drop: []

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist

ports:
  web:
    port: 80
    hostPort: 80
    expose:
      default: true
  websecure:
    port: 443
    hostPort: 443
    expose:
      default: true

providers:
  kubernetesIngress:
    enabled: true
    ingressClass: traefik
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true

ingressClass:
  enabled: true
  isDefaultClass: true

service:
  type: ClusterIP

# Let's Encrypt TLS certificates (HTTP-01 challenge on port 80)
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 128Mi
  path: /data

certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@smartops.space
      storage: /data/acme.json
      httpChallenge:
        entryPoint: web

additionalArguments:
  - "--ping=true"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
